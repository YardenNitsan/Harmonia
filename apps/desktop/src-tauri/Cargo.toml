[package]
name = "harmonia"
version = "0.1.0"
description = "Local-first chord analysis desktop application"
authors = ["Harmonia contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "harmonia_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "harmonia"
path = "src/main.rs"

[build-dependencies]
base64 = "0.22.1"
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.16"

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
