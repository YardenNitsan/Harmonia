[package]
name = "harmonia"
version = "0.1.0"
description = "Local-first chord analysis desktop application"
authors = ["Harmonia contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "harmonia_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "harmonia"
path = "src/main.rs"

[build-dependencies]
base64 = "0.22.1"
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.16"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_Security", "Win32_UI_Shell_PropertiesSystem"] }
windows-core = "=0.61.2"

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
